name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: CI Preflight
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.chart.outputs.app_version }}
      chart_name: ${{ steps.chart.outputs.chart_name }}
      chart_package: ${{ steps.chart.outputs.chart_package }}
      chart_version: ${{ steps.chart.outputs.chart_version }}
      image_repository: ${{ steps.chart.outputs.image_repository }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Read chart metadata
        id: chart
        run: |
          chart_name="$(awk -F': *' '$1 == "name" { gsub(/^["'\'' ]+|["'\'' ]+$/, "", $2); print $2; exit }' chart/vpa-creator/Chart.yaml)"
          chart_version="$(awk -F': *' '$1 == "version" { gsub(/^["'\'' ]+|["'\'' ]+$/, "", $2); print $2; exit }' chart/vpa-creator/Chart.yaml)"
          app_version="$(awk -F': *' '$1 == "appVersion" { gsub(/^["'\'' ]+|["'\'' ]+$/, "", $2); print $2; exit }' chart/vpa-creator/Chart.yaml)"
          image_repository="$(awk -F': *' '$1 == "  repository" { gsub(/^["'\'' ]+|["'\'' ]+$/, "", $2); print $2; exit }' chart/vpa-creator/values.yaml)"

          if [[ -z "$chart_name" ]]; then
            echo "::error file=chart/vpa-creator/Chart.yaml::name is required"
            exit 1
          fi

          if [[ -z "$chart_version" ]]; then
            echo "::error file=chart/vpa-creator/Chart.yaml::version is required"
            exit 1
          fi

          if [[ -z "$app_version" ]]; then
            echo "::error file=chart/vpa-creator/Chart.yaml::appVersion is required"
            exit 1
          fi

          if [[ ! "$app_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-._][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=chart/vpa-creator/Chart.yaml::appVersion must be tag-safe, for example 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          chart_package="${chart_name}-${chart_version}.tgz"

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "chart_name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "chart_package=$chart_package" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"

  controller-binary:
    name: Controller Binary
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test Go
        run: |
          go mod tidy
          make test

      - name: Setup Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Test controller e2e
        run: |
          make test-e2e

      - name: Build controller binary
        run: |
          mkdir -p dist/artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/artifacts/vpa-creator-linux-amd64 ./cmd/main.go
          sha256sum dist/artifacts/vpa-creator-linux-amd64 > dist/artifacts/vpa-creator-linux-amd64.sha256

  controller-image:
    name: Controller Image
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata mapping
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/vpa-creator
          tags: |
            type=raw,value=${{ needs.preflight.outputs.app_version }}
            type=sha,prefix=sha-

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  controller-chart:
    name: Controller Chart
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Setup Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Lint Helm chart
        run: |
          helm lint ./chart/vpa-creator

      - name: Create Kind cluster
        run: |
          make docker-build
          kind create cluster
          kind load docker-image controller:latest

      - name: Test Helm chart deployment
        run: |
          helm upgrade --install vpa-creator ./chart/vpa-creator \
            --namespace vpa-creator-system \
            --create-namespace \
            --set namespace.create=false \
            --set image.repository=controller \
            --set image.tag=latest \
            --wait \
            --timeout 5m

      - name: Check Helm release status
        run: |
          helm status vpa-creator --namespace vpa-creator-system

      - name: Package Helm chart
        run: |
          mkdir -p dist/charts
          helm package chart/vpa-creator --destination dist/charts
          test -f "dist/charts/${{ needs.preflight.outputs.chart_package }}"
